<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>CraneCat喵~</title>
    <!-- CSS -->
    <link rel="stylesheet" href="/style.css?v=20260905-cleanup-icons">
    <!-- Markdown renderer & syntax highlighter -->
    <script src="/libs/js/highlight.min.js"></script>
    <!-- Syntax highlight theme -->
    <link rel="stylesheet" href="/libs/css/github.min.css">
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="/libs/katex/katex.min.css">
    <script src="/libs/js/katex.min.js"></script>
    <!-- MarkdownIt -->
    <script src="/libs/js/markdown-it.min.js"></script>
    <script src="/libs/js/texmath.js"></script>
    <script src="/js/core.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/toc.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/notes.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/home.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/log.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/friends.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/tree.js?v=20260905-cleanup-icons" defer></script>
    <script src="/libs/js/fuse.min.js"></script>
    <script src="/js/search.js?v=20260905-cleanup-icons" defer></script>
    <script src="/script.js?v=20260905-cleanup-icons" defer></script>
    <script src="/js/ripple.js?v=20260905-cleanup-icons" defer></script>
</head>

<body class="homepage hide-sidebar is-booting">
    <!-- Top bar -->
    <div class="topbar">
        <div class="topbar-inner">
            <div class="topbar-left">
                <button class="menu-btn" id="menuToggle" aria-label="菜单">
            </div>
            <div class="topbar-center">
                <span class="site-title">CraneCat喵~</span>
            </div>
            <div class="topbar-right">
                <button class="nav-btn" id="homeBtn">首页</button>
                <button class="nav-btn" id="notesBtn">笔记</button>
                <button class="nav-btn" id="friendsBtn">友链</button>
                <button class="nav-btn" id="logBtn">日志</button>
                <button class="nav-btn search-btn" id="searchBtn" aria-label="搜索" aria-haspopup="dialog"
                    aria-expanded="false" title="搜索 (Ctrl+K)">

                    <span>搜索</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Sidebar overlay (mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Layout: sidebar + content -->
    <div class="app-grid" id="appGrid">
        <!-- Sidebar: collapsible tree -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    <span>笔记目录</span>
                </div>
            </div>
            <!-- Mobile-only nav links in sidebar -->
            <div class="sidebar-nav-mobile">
                <button class="sidebar-nav-btn" data-hash="">首页</button>
                <button class="sidebar-nav-btn" data-hash="notes">笔记</button>
                <button class="sidebar-nav-btn" data-hash="friends">友链</button>
                <button class="sidebar-nav-btn" data-hash="logs">日志</button>
            </div>
            <!-- Tree renders here -->
            <nav class="tree-container" id="treeContainer">
                <div class="tree-placeholder">Loading...</div>
            </nav>
            <div class="sidebar-footer">tbc~</div>
        </aside>
        <div class="main-flex">
            <!-- Main content -->
            <main class="main-content" id="mainContent">
                <div class="viewer" id="viewer">
                </div>
                <div class="content-footer-decoration">*@#$</div>
            </main>
            <!-- Right sidebar table of contents -->
            <aside class="toc-sidebar" id="tocSidebar">
                <div class="toc-header">
                    <span>Table of Contents</span>
                    <button class="toc-collapse-btn" id="toggleToc">⏴⏵</button>
                </div>
                <nav class="toc-content" id="tocContent">
                    <!-- Dynamically generated table of contents will be placed here -->
                </nav>
            </aside>
        </div>
    </div>

    <!-- Search overlay -->
    <div class="search-overlay" id="searchOverlay" aria-hidden="true">
        <div class="search-modal" role="dialog" aria-modal="true" aria-labelledby="searchDialogTitle">
            <h2 class="search-dialog-title" id="searchDialogTitle">搜索笔记</h2>
            <div class="search-header">

                <input type="search" class="search-input" id="searchInput" placeholder="搜索标题或正文…" autocomplete="off"
                    spellcheck="false" role="combobox" aria-label="搜索笔记" aria-autocomplete="list"
                    aria-controls="searchResults" aria-expanded="false">
                <button class="search-clear-btn" id="searchClearBtn" aria-label="清空搜索" hidden>清空</button>
                <button class="search-close-btn" id="searchCloseBtn" aria-label="关闭搜索">✕</button>
            </div>
            <div class="search-results" id="searchResults" role="listbox" aria-label="搜索结果">
                <div class="search-state search-hint">
                    <span>输入关键词，搜索标题与笔记正文</span>
                </div>
            </div>
            <div class="search-footer">
                <span><kbd>↑</kbd><kbd>↓</kbd> 导航</span>
                <span><kbd>Enter</kbd> 打开</span>
                <span><kbd>Esc</kbd> 关闭</span>
            </div>
        </div>
    </div>
</body>

</html>
