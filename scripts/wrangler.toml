name = "pv-counter"
main = "counter-worker.js"
compatibility_date = "2024-01-01"

# KV 命名空间绑定
kv_namespaces = [
  { binding = "PV_COUNTER", id = "f72798e6540d434788fc3d7d450691ea" }
]

# 匿名计数的配额保护；此命名空间仅供本站计数使用。
[[ratelimits]]
name = "PV_RATE_LIMIT"
namespace_id = "2026102601"
simple = { limit = 60, period = 60 }
